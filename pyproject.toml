[project]
name = "nighthelm"
version = "0.1.0"
description = "Headless camera-based PushTo navigation for manually aimed telescopes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = ["Development Status :: 1 - Planning", "Operating System :: OS Independent"]
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
